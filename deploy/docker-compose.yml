services:
  subnetx:
    profiles: ["tools"]
    build:
      context: ../subnetx_runtime/image
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      SUBNETX_DATABASE: /runtime/subnetx/data/subnetx_extraction.sqlite
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    volumes:
      - ../subnetx_runtime/data:/runtime/subnetx/data:ro
    expose:
      - "8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    mem_limit: 2g
    cpus: 2.0
    networks:
      - internal

  retrobiocat:
    profiles: ["tools"]
    build:
      context: ../retrobiocat_runtime/image
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      RETROBIOCAT_SOURCE_ROOT: /runtime/retrobiocat/source
      RETROBIOCAT_RULES_YAML: /runtime/retrobiocat/data/rxns_yaml.yaml
      RETROBIOCAT_BUILDING_BLOCKS_DB: /runtime/retrobiocat/data/building_blocks.db
      RETROBIOCAT_TIMEOUT_SECONDS: "240"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    volumes:
      - ../retrobiocat_runtime/source:/runtime/retrobiocat/source:ro
      - ../retrobiocat_runtime/data:/runtime/retrobiocat/data:ro
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    mem_limit: 2g
    cpus: 2.0
    networks:
      - internal

  predictor:
    profiles: ["tools"]
    build:
      context: ../predictor_runtime/image
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      RETROSYNTHESIS_DATA_ROOT: /runtime/predictor_data
      RETROSYNTHESIS_PREDICTOR_TIMEOUT_SECONDS: "240"
      OMP_NUM_THREADS: "3"
      MKL_NUM_THREADS: "3"
      OPENBLAS_NUM_THREADS: "3"
    volumes:
      - ../predictor_runtime/data:/runtime/predictor_data:ro
      - ../scripts:/runtime/scripts:ro
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    mem_limit: 4g
    cpus: 3.0
    networks:
      - internal

  web:
    build:
      context: ../nextjs_site/Nicktio-nextjs-pro-main/package
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://127.0.0.1}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      REACTENZDB_RELEASE_DIR: /app/web_release
      REACTENZDB_DOWNLOAD_ROOT: /app/downloads
      HOST_CONTEXT_ENABLED: "0"
      HOST_CONTEXT_STAGING_DB_PATH: /app/host_context/host_context_v1.sqlite
      REACTENZDB_PATHWAY_COEFFICIENT_EVIDENCE_PATH: /app/host_context/reaction_evidence.tsv
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://127.0.0.1}
      REACTENZDB_ANALYTICS_DB: /app/runtime/reactenzdb_analytics.sqlite
      REACTENZDB_ANALYTICS_SALT: ${REACTENZDB_ANALYTICS_SALT}
      REACTENZDB_PYTHON: /opt/reactenzdb-python/bin/python
      REACTENZDB_REACTION_STANDARDIZATION_DB: /app/web_release/reaction_standardization.sqlite
      REACTENZDB_EXPRESSION_EVIDENCE_DB: /app/expression_work/expression_evidence.sqlite
      REACTENZDB_EVIDENCE_RELEASE_DIR: /app/evidence_work/release_candidate
      REACTENZDB_EVIDENCE_DB: /app/evidence_work/release_candidate/reactenzdb_evidence_rc.sqlite
      ENZY_MODEL_QUEUE_DIR: /app/runtime/model_queue
      RETROSYNTHESIS_SERVICE_URL: http://predictor:8001
      RETROSYNTHESIS_ENABLED_TOOLS: ${RETROSYNTHESIS_ENABLED_TOOLS:-disabled}
      RETROSYNTHESIS_TIMEOUT_MS: "240000"
      RETROBIOCAT_SERVICE_URL: http://retrobiocat:8002
      RETROBIOCAT_ENABLED: ${RETROBIOCAT_ENABLED:-false}
      RETROBIOCAT_TIMEOUT_MS: "240000"
      SUBNETX_SERVICE_URL: http://subnetx:8003
      SUBNETX_ENABLED: ${SUBNETX_ENABLED:-false}
      SUBNETX_TIMEOUT_MS: "180000"
    volumes:
      - ../web_release:/app/web_release:ro
      - ../data/downloads:/app/downloads:ro
      - ../data/host_context:/app/host_context:ro
      - ../data/expression_work:/app/expression_work:ro
      - ../data/evidence_release:/app/evidence_work/release_candidate:ro
      - ../runtime:/app/runtime
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    mem_limit: 3g
    cpus: 3.0
    networks:
      - internal

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LOCAL_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - internal

networks:
  internal:
    name: reactenzdb_source_local
