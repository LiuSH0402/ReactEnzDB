<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 294 54" role="img" aria-labelledby="title desc">
  <title id="title">ReactEnzDB</title>
  <desc id="desc">ReactEnzDB wordmark with a reaction arrow linking React and Enz.</desc>
  <defs>
    <linearGradient id="react" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="0.36" stop-color="#e4edfb"/>
      <stop offset="0.72" stop-color="#a9c5ee"/>
      <stop offset="1" stop-color="#86afe8"/>
    </linearGradient>
    <linearGradient id="enz" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8db9ec"/>
      <stop offset="0.55" stop-color="#72c8df"/>
      <stop offset="1" stop-color="#63d2c9"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8aaee6"/>
      <stop offset="1" stop-color="#79c9d7"/>
    </linearGradient>
  </defs>

  <g font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="46" font-style="italic" font-weight="800" letter-spacing="-1.5">
    <text x="2" y="43" fill="url(#react)">React</text>
    <text x="134" y="43" fill="url(#enz)">Enz</text>
    <text x="216" y="43" fill="#c8d6e8">DB</text>
  </g>

  <path d="M112 14h8V9l13 10-13 10v-5h-8z" fill="url(#arrow)"/>
  <circle cx="151.5" cy="34.5" r="2.6" fill="#6ed4cc"/>
</svg>
